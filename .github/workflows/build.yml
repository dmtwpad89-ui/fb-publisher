      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # Yahan maine command fix ki hai (ab ye </activity> ke pehle add karega)
      - name: Add Deep Link to AndroidManifest
        run: |
          sed -i 's|</activity>|<intent-filter android:autoVerify="true"><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="com.alcashgo.clone" android:host="auth" /></intent-filter></activity>|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alcashgo-clone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
