name: Build FB Publisher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          mkdir -p src/components/layout src/components/shared src/pages src/lib

          cat > package.json << 'ENDOFFILE'
          {
            "name": "fb-publisher",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/splash-screen": "^6.0.2",
              "clsx": "^2.1.1",
              "lucide-react": "^0.454.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1",
              "react-router-dom": "^6.27.0",
              "tailwind-merge": "^2.5.4"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "@types/react": "^18.3.12",
              "@types/react-dom": "^18.3.1",
              "@vitejs/plugin-react": "^4.3.3",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.47",
              "tailwindcss": "^3.4.14",
              "typescript": "^5.6.3",
              "vite": "^5.4.10"
            }
          }
          ENDOFFILE

          cat > vite.config.ts << 'ENDOFFILE'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import path from 'path';

          export default defineConfig({
            plugins: [react()],
            resolve: {
              alias: { '@': path.resolve(__dirname, './src') },
            },
          });
          ENDOFFILE

          cat > tailwind.config.js << 'ENDOFFILE'
          export default {
            content: ['./index.html', './src/**/*.{ts,tsx}'],
            theme: { extend: {} },
            plugins: [],
          };
          ENDOFFILE

          cat > postcss.config.js << 'ENDOFFILE'
          export default {
            plugins: { tailwindcss: {}, autoprefixer: {} },
          };
          ENDOFFILE

          cat > tsconfig.json << 'ENDOFFILE'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] }
            },
            "include": ["src"]
          }
          ENDOFFILE

          cat > index.html << 'ENDOFFILE'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>FB Publisher</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          ENDOFFILE

          cat > capacitor.config.ts << 'ENDOFFILE'
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.fbpublisher.app',
            appName: 'FB Publisher',
            webDir: 'dist',
            server: { androidScheme: 'https' },
            plugins: {
              SplashScreen: {
                launchShowDuration: 1500,
                backgroundColor: '#4F46E5',
                showSpinner: false,
              },
            },
          };

          export default config;
          ENDOFFILE

          cat > src/main.tsx << 'ENDOFFILE'
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App';
          import './index.css';

          ReactDOM.createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          ENDOFFILE

          cat > src/index.css << 'ENDOFFILE'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;

          body {
            @apply bg-slate-50 text-slate-900 antialiased;
            font-family: 'Inter', system-ui, sans-serif;
          }
          ENDOFFILE

          cat > src/lib/utils.ts << 'ENDOFFILE'
          import { clsx, type ClassValue } from 'clsx';
          import { twMerge } from 'tailwind-merge';

          export function cn(...inputs: ClassValue[]) {
            return twMerge(clsx(inputs));
          }
          ENDOFFILE

          cat > src/App.tsx << 'ENDOFFILE'
          import { BrowserRouter, Routes, Route } from 'react-router-dom';
          import { AppLayout } from '@/components/layout/AppLayout';
          import Dashboard from '@/pages/Dashboard';
          import Compose from '@/pages/Compose';
          import Scheduled from '@/pages/Scheduled';
          import Published from '@/pages/Published';
          import Pages from '@/pages/Pages';
          import Media from '@/pages/Media';
          import Analytics from '@/pages/Analytics';
          import Settings from '@/pages/Settings';

          export default function App() {
            return (
              <BrowserRouter>
                <Routes>
                  <Route element={<AppLayout />}>
                    <Route path="/" element={<Dashboard />} />
                    <Route path="/compose" element={<Compose />} />
                    <Route path="/scheduled" element={<Scheduled />} />
                    <Route path="/published" element={<Published />} />
                    <Route path="/pages" element={<Pages />} />
                    <Route path="/media" element={<Media />} />
                    <Route path="/analytics" element={<Analytics />} />
                    <Route path="/settings" element={<Settings />} />
                  </Route>
                </Routes>
              </BrowserRouter>
            );
          }
          ENDOFFILE

          cat > src/components/layout/Sidebar.tsx << 'ENDOFFILE'
          import { NavLink } from 'react-router-dom';
          import {
            LayoutDashboard, PenSquare, CalendarClock, CheckCircle2,
            Facebook, Image, BarChart3, Settings, LogOut,
          } from 'lucide-react';
          import { cn } from '@/lib/utils';

          const nav = [
            { to: '/', label: 'Dashboard', icon: LayoutDashboard },
            { to: '/compose', label: 'Compose', icon: PenSquare },
            { to: '/scheduled', label: 'Scheduled', icon: CalendarClock },
            { to: '/published', label: 'Published', icon: CheckCircle2 },
            { to: '/pages', label: 'Pages', icon: Facebook },
            { to: '/media', label: 'Media', icon: Image },
            { to: '/analytics', label: 'Analytics', icon: BarChart3 },
          ];

          export function Sidebar() {
            return (
              <aside className="w-64 border-r bg-white flex flex-col h-screen sticky top-0">
                <div className="h-16 flex items-center gap-2 px-6 border-b">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">F</div>
                  <span className="font-semibold text-slate-900">FB Publisher</span>
                </div>
                <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
                  {nav.map(({ to, label, icon: Icon }) => (
                    <NavLink
                      key={to}
                      to={to}
                      end={to === '/'}
                      className={({ isActive }) =>
                        cn(
                          'flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition',
                          isActive
                            ? 'bg-indigo-50 text-indigo-700'
                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                        )
                      }
                    >
                      <Icon size={18} />
                      {label}
                    </NavLink>
                  ))}
                </nav>
                <div className="p-3 border-t space-y-1">
                  <NavLink
                    to="/settings"
                    className={({ isActive }) =>
                      cn(
                        'flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium',
                        isActive ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-50'
                      )
                    }
                  >
                    <Settings size={18} /> Settings
                  </NavLink>
                  <button className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
                    <LogOut size={18} /> Logout
                  </button>
                </div>
              </aside>
            );
          }
          ENDOFFILE

          cat > src/components/layout/Topbar.tsx << 'ENDOFFILE'
          import { Bell, Search, Plus } from 'lucide-react';
          import { Link } from 'react-router-dom';

          export function Topbar() {
            return (
              <header className="h-16 border-b bg-white flex items-center justify-between px-6 sticky top-0 z-10">
                <div className="relative w-96">
                  <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input
                    placeholder="Search posts, pages..."
                    className="w-full pl-9 pr-3 py-2 text-sm border rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div className="flex items-center gap-3">
                  <Link
                    to="/compose"
                    className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700"
                  >
                    <Plus size={16} /> New Post
                  </Link>
                  <button className="p-2 rounded-lg hover:bg-slate-100 relative">
                    <Bell size={18} />
                    <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full" />
                  </button>
                  <div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white text-sm font-semibold">
                    AK
                  </div>
                </div>
              </header>
            );
          }
          ENDOFFILE

          cat > src/components/layout/AppLayout.tsx << 'ENDOFFILE'
          import { Outlet } from 'react-router-dom';
          import { Sidebar } from './Sidebar';
          import { Topbar } from './Topbar';

          export function AppLayout() {
            return (
              <div className="flex min-h-screen bg-slate-50">
                <Sidebar />
                <div className="flex-1 flex flex-col min-w-0">
                  <Topbar />
                  <main className="flex-1 p-6">
                    <Outlet />
                  </main>
                </div>
              </div>
            );
          }
          ENDOFFILE

          cat > src/components/shared/StatCard.tsx << 'ENDOFFILE'
          import { LucideIcon } from 'lucide-react';

          const colors = {
            indigo: 'bg-indigo-50 text-indigo-600',
            amber: 'bg-amber-50 text-amber-600',
            emerald: 'bg-emerald-50 text-emerald-600',
            rose: 'bg-rose-50 text-rose-600',
          };

          export function StatCard({ label, value, change, icon: Icon, color }: {
            label: string; value: string; change: string;
            icon: LucideIcon; color: keyof typeof colors;
          }) {
            return (
              <div className="bg-white rounded-xl border p-5">
                <div className="flex items-start justify-between">
                  <div>
                    <p className="text-sm text-slate-500">{label}</p>
                    <p className="text-2xl font-bold text-slate-900 mt-1">{value}</p>
                  </div>
                  <div className={`p-2.5 rounded-lg ${colors[color]}`}>
                    <Icon size={20} />
                  </div>
                </div>
                <p className="text-xs text-emerald-600 mt-3 font-medium">{change} vs last week</p>
              </div>
            );
          }
          ENDOFFILE

          cat > src/components/shared/StatusBadge.tsx << 'ENDOFFILE'
          const styles = {
            scheduled: 'bg-amber-50 text-amber-700 border-amber-200',
            published: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            draft: 'bg-slate-50 text-slate-600 border-slate-200',
            failed: 'bg-red-50 text-red-700 border-red-200',
          };

          export function StatusBadge({ status }: { status: keyof typeof styles }) {
            return (
              <span className={`text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full border ${styles[status]}`}>
                {status}
              </span>
            );
          }
          ENDOFFILE

          cat > src/components/shared/PostCard.tsx << 'ENDOFFILE'
          import { StatusBadge } from './StatusBadge';
          import { Edit, Trash2 } from 'lucide-react';

          export function PostCard({ page, content, scheduledAt, status }: {
            page: string; content: string; scheduledAt: string;
            status: 'scheduled' | 'published' | 'draft' | 'failed';
          }) {
            return (
              <div className="flex items-start gap-3 p-3 rounded-lg border hover:border-indigo-200 transition group">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex-shrink-0" />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1">
                    <p className="text-sm font-medium text-slate-900">{page}</p>
                    <StatusBadge status={status} />
                  </div>
                  <p className="text-sm text-slate-600 line-clamp-2">{content}</p>
                  <p className="text-xs text-slate-400 mt-1.5">{scheduledAt}</p>
                </div>
                <div className="opacity-0 group-hover:opacity-100 flex gap-1">
                  <button className="p-1.5 rounded hover:bg-slate-100"><Edit size={14} /></button>
                  <button className="p-1.5 rounded hover:bg-slate-100 text-red-600"><Trash2 size={14} /></button>
                </div>
              </div>
            );
          }
          ENDOFFILE

          cat > src/components/shared/EmptyState.tsx << 'ENDOFFILE'
          import { LucideIcon } from 'lucide-react';

          export function EmptyState({ icon: Icon, title, description }: {
            icon: LucideIcon; title: string; description: string;
          }) {
            return (
              <div className="text-center py-16">
                <div className="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-4">
                  <Icon size={24} className="text-slate-400" />
                </div>
                <h3 className="font-semibold text-slate-900">{title}</h3>
                <p className="text-sm text-slate-500 mt-1">{description}</p>
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Dashboard.tsx << 'ENDOFFILE'
          import { StatCard } from '@/components/shared/StatCard';
          import { PostCard } from '@/components/shared/PostCard';
          import { FileText, CalendarClock, CheckCircle2, TrendingUp, Plus } from 'lucide-react';
          import { Link } from 'react-router-dom';

          export default function Dashboard() {
            return (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900">Dashboard</h1>
                    <p className="text-sm text-slate-500 mt-1">Overview of your publishing activity</p>
                  </div>
                  <Link
                    to="/compose"
                    className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700"
                  >
                    <Plus size={16} /> Create Post
                  </Link>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  <StatCard label="Total Posts" value="248" change="+12%" icon={FileText} color="indigo" />
                  <StatCard label="Scheduled" value="14" change="+3" icon={CalendarClock} color="amber" />
                  <StatCard label="Published" value="234" change="+9%" icon={CheckCircle2} color="emerald" />
                  <StatCard label="Engagement" value="12.4K" change="+18%" icon={TrendingUp} color="rose" />
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-white rounded-xl border p-5">
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="font-semibold text-slate-900">Upcoming Posts</h2>
                      <Link to="/scheduled" className="text-sm text-indigo-600 hover:underline">View all</Link>
                    </div>
                    <div className="space-y-3">
                      <PostCard page="My Business Page" content="Exciting news coming this Friday! Stay tuned" scheduledAt="Today, 3:00 PM" status="scheduled" />
                      <PostCard page="Tech Tips Daily" content="5 VS Code extensions that will 10x your workflow..." scheduledAt="Tomorrow, 9:00 AM" status="scheduled" />
                      <PostCard page="My Business Page" content="Behind the scenes of our latest product launch" scheduledAt="Dec 15, 12:00 PM" status="draft" />
                    </div>
                  </div>

                  <div className="bg-white rounded-xl border p-5">
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="font-semibold text-slate-900">Connected Pages</h2>
                      <Link to="/pages" className="text-sm text-indigo-600 hover:underline">Manage</Link>
                    </div>
                    <div className="space-y-3">
                      {[
                        { name: 'My Business Page', followers: '12.4K', initials: 'MB' },
                        { name: 'Tech Tips Daily', followers: '8.2K', initials: 'TT' },
                        { name: 'Design Inspiration', followers: '24.1K', initials: 'DI' },
                      ].map((p) => (
                        <div key={p.name} className="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50">
                          <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-sm font-semibold">
                            {p.initials}
                          </div>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-medium text-slate-900 truncate">{p.name}</p>
                            <p className="text-xs text-slate-500">{p.followers} followers</p>
                          </div>
                          <span className="w-2 h-2 rounded-full bg-emerald-500" />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Compose.tsx << 'ENDOFFILE'
          import { useState } from 'react';
          import { Image, Link2, Hash, Send, Clock } from 'lucide-react';

          export default function Compose() {
            const [content, setContent] = useState('');
            const [pages, setPages] = useState<string[]>([]);
            const [mode, setMode] = useState<'now' | 'schedule'>('now');

            const togglePage = (id: string) =>
              setPages((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));

            return (
              <div className="max-w-5xl mx-auto space-y-6">
                <div>
                  <h1 className="text-2xl font-bold text-slate-900">Compose Post</h1>
                  <p className="text-sm text-slate-500 mt-1">Create and publish to your Facebook pages</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-white rounded-xl border p-6 space-y-4">
                    <div>
                      <label className="text-sm font-medium text-slate-700 mb-2 block">Publish to</label>
                      <div className="flex flex-wrap gap-2">
                        {[
                          { id: 'p1', name: 'My Business Page' },
                          { id: 'p2', name: 'Tech Tips Daily' },
                          { id: 'p3', name: 'Design Inspiration' },
                        ].map((p) => (
                          <button
                            key={p.id}
                            onClick={() => togglePage(p.id)}
                            className={`px-3 py-1.5 text-sm rounded-lg border transition ${
                              pages.includes(p.id)
                                ? 'bg-indigo-50 border-indigo-300 text-indigo-700'
                                : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'
                            }`}
                          >
                            {p.name}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-sm font-medium text-slate-700 mb-2 block">Content</label>
                      <textarea
                        value={content}
                        onChange={(e) => setContent(e.target.value)}
                        rows={8}
                        placeholder="What's on your mind? Write your post here..."
                        className="w-full p-4 text-sm border rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <div className="flex items-center justify-between mt-2">
                        <div className="flex gap-1">
                          <button className="p-2 rounded hover:bg-slate-100 text-slate-500"><Image size={16} /></button>
                          <button className="p-2 rounded hover:bg-slate-100 text-slate-500"><Link2 size={16} /></button>
                          <button className="p-2 rounded hover:bg-slate-100 text-slate-500"><Hash size={16} /></button>
                        </div>
                        <span className="text-xs text-slate-400">{content.length} characters</span>
                      </div>
                    </div>

                    <div>
                      <label className="text-sm font-medium text-slate-700 mb-2 block">Publishing</label>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setMode('now')}
                          className={`flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm rounded-lg border ${
                            mode === 'now' ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'border-slate-200'
                          }`}
                        >
                          <Send size={16} /> Publish now
                        </button>
                        <button
                          onClick={() => setMode('schedule')}
                          className={`flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm rounded-lg border ${
                            mode === 'schedule' ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'border-slate-200'
                          }`}
                        >
                          <Clock size={16} /> Schedule
                        </button>
                      </div>
                      {mode === 'schedule' && (
                        <input
                          type="datetime-local"
                          className="mt-3 w-full px-4 py-2.5 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      )}
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button className="px-4 py-2 text-sm border rounded-lg hover:bg-slate-50">Save as Draft</button>
                      <button className="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                        {mode === 'now' ? 'Publish Now' : 'Schedule Post'}
                      </button>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl border p-5 h-fit">
                    <h3 className="font-semibold text-slate-900 mb-3">Live Preview</h3>
                    <div className="border rounded-lg overflow-hidden">
                      <div className="p-3 flex items-center gap-2 border-b">
                        <div className="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600" />
                        <div>
                          <p className="text-sm font-semibold">My Business Page</p>
                          <p className="text-xs text-slate-500">Just now</p>
                        </div>
                      </div>
                      <div className="p-3 text-sm text-slate-800 whitespace-pre-wrap min-h-[80px]">
                        {content || <span className="text-slate-400">Your post preview will appear here...</span>}
                      </div>
                      <div className="border-t px-3 py-2 flex gap-4 text-xs text-slate-500">
                        <span>Like</span><span>Comment</span><span>Share</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Scheduled.tsx << 'ENDOFFILE'
          import { PostCard } from '@/components/shared/PostCard';

          export default function Scheduled() {
            const posts = [
              { page: 'My Business Page', content: 'Exciting news coming this Friday!', scheduledAt: 'Today, 3:00 PM', status: 'scheduled' as const },
              { page: 'Tech Tips Daily', content: '5 VS Code extensions that will 10x your workflow...', scheduledAt: 'Tomorrow, 9:00 AM', status: 'scheduled' as const },
            ];

            return (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-bold text-slate-900">Scheduled Posts</h1>
                  <p className="text-sm text-slate-500 mt-1">{posts.length} posts in queue</p>
                </div>
                <div className="bg-white rounded-xl border p-5">
                  <div className="space-y-3">
                    {posts.map((p, i) => <PostCard key={i} {...p} />)}
                  </div>
                </div>
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Published.tsx << 'ENDOFFILE'
          import { PostCard } from '@/components/shared/PostCard';

          export default function Published() {
            const posts = [
