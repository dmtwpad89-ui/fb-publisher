name: Build AlcashGo Clone APK (Serverless BYOA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create project files
        run: |
          mkdir -p src/components/layout src/pages src/lib

          # Purani cache aur lock files delete karna
          rm -rf node_modules package-lock.json

          cat > package.json << 'ENDOFFILE'
          {
            "name": "alcashgo-clone",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": { "dev": "vite", "build": "vite build" },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/browser": "^6.0.2",
              "@capacitor/app": "^6.0.1",
              "@capacitor/preferences": "^6.0.1",
              "clsx": "^2.1.1",
              "lucide-react": "^0.454.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1",
              "react-router-dom": "^6.27.0",
              "tailwind-merge": "^2.5.4"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "@types/react": "^18.3.12",
              "@types/react-dom": "^18.3.1",
              "@vitejs/plugin-react": "^4.3.3",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.47",
              "tailwindcss": "^3.4.14",
              "typescript": "^5.6.3",
              "vite": "^5.4.10"
            }
          }
          ENDOFFILE

          cat > vite.config.ts << 'ENDOFFILE'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import path from 'path';
          export default defineConfig({
            plugins: [react()],
            resolve: { alias: { '@': path.resolve(__dirname, './src') } },
          });
          ENDOFFILE

          cat > tailwind.config.js << 'ENDOFFILE'
          export default { content: ['./index.html', './src/**/*.{ts,tsx}'], theme: { extend: {} }, plugins: [] };
          ENDOFFILE

          cat > postcss.config.js << 'ENDOFFILE'
          export default { plugins: { tailwindcss: {}, autoprefixer: {} } };
          ENDOFFILE

          cat > tsconfig.json << 'ENDOFFILE'
          {
            "compilerOptions": {
              "target": "ES2020", "module": "ESNext", "moduleResolution": "bundler",
              "jsx": "react-jsx", "strict": false, "esModuleInterop": true,
              "skipLibCheck": true, "baseUrl": ".", "paths": { "@/*": ["src/*"] }
            }, "include": ["src"]
          }
          ENDOFFILE

          cat > index.html << 'ENDOFFILE'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>AlcashGo Clone</title>
            </head>
            <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
          </html>
          ENDOFFILE

          cat > capacitor.config.ts << 'ENDOFFILE'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.alcashgo.clone',
            appName: 'AlcashGo',
            webDir: 'dist',
            server: { androidScheme: 'https' },
            plugins: {
              SplashScreen: {
                launchShowDuration: 1500,
                backgroundColor: '#0F172A',
                showSpinner: false,
              }
            },
          };
          export default config;
          ENDOFFILE

          cat > src/main.tsx << 'ENDOFFILE'
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App';
          import './index.css';
          ReactDOM.createRoot(document.getElementById('root')!).render(<React.StrictMode><App /></React.StrictMode>);
          ENDOFFILE

          cat > src/index.css << 'ENDOFFILE'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          body { @apply bg-[#0F172A] text-slate-200 antialiased; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
          .scrollbar-hide::-webkit-scrollbar { display: none; }
          .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
          ENDOFFILE

          cat > src/lib/utils.ts << 'ENDOFFILE'
          import { clsx, type ClassValue } from 'clsx';
          import { twMerge } from 'tailwind-merge';
          export function cn(...inputs: ClassValue[]) { return twMerge(clsx(inputs)); }
          ENDOFFILE

          cat > src/App.tsx << 'ENDOFFILE'
          import { BrowserRouter, Routes, Route } from 'react-router-dom';
          import { AppLayout } from '@/components/layout/AppLayout';
          import Dashboard from '@/pages/Dashboard';
          import Compose from '@/pages/Compose';
          import Pages from '@/pages/Pages';
          import Library from '@/pages/Library';
          import More from '@/pages/More';

          export default function App() {
            return (
              <BrowserRouter>
                <Routes>
                  <Route element={<AppLayout />}>
                    <Route path="/" element={<Dashboard />} />
                    <Route path="/post" element={<Compose />} />
                    <Route path="/pages" element={<Pages />} />
                    <Route path="/library" element={<Library />} />
                    <Route path="/more" element={<More />} />
                  </Route>
                </Routes>
              </BrowserRouter>
            );
          }
          ENDOFFILE

          cat > src/components/layout/AppLayout.tsx << 'ENDOFFILE'
          import { Outlet, NavLink } from 'react-router-dom';
          import { Home, LayoutGrid, Plus, Video, Menu } from 'lucide-react';
          import { cn } from '@/lib/utils';

          const navItems = [
            { to: '/', icon: Home, label: 'Home' },
            { to: '/pages', icon: LayoutGrid, label: 'Pages' },
            { to: '/post', icon: Plus, label: 'Post', isCenter: true },
            { to: '/library', icon: Video, label: 'Library' },
            { to: '/more', icon: Menu, label: 'More' },
          ];

          export function AppLayout() {
            return (
              <div className="flex flex-col min-h-screen bg-[#0F172A] pb-20">
                <main className="flex-1 overflow-y-auto"><Outlet /></main>
                <nav className="fixed bottom-0 left-0 right-0 bg-[#0F172A] border-t border-slate-800 flex justify-around items-center h-16 px-2 z-50">
                  {navItems.map(({ to, icon: Icon, label, isCenter }) => (
                    <NavLink key={to} to={to} className={({ isActive }) => cn('flex flex-col items-center justify-center w-full h-full space-y-1', isActive ? 'text-orange-500' : 'text-slate-400 hover:text-slate-300')}>
                      {isCenter ? (
                        <div className="bg-orange-500 text-white p-3 rounded-full -mt-6 shadow-lg shadow-orange-500/30"><Icon size={24} /></div>
                      ) : (<Icon size={22} />)}
