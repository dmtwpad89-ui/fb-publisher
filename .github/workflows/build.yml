          ENDOFFILE

          cat > src/pages/Dashboard.tsx << 'ENDOFFILE'
          import { useState, useEffect } from 'react';
          import { Bell, Power, LayoutGrid, CheckCircle2, AlertCircle, Clock, Users, ChevronRight } from 'lucide-react';

          export default function Dashboard() {
            const [engineOn, setEngineOn] = useState(false);

            useEffect(() => {
              let interval: any;
              if (engineOn) {
                interval = setInterval(async () => {
                  const posts = JSON.parse(localStorage.getItem('scheduled_posts') || '[]');
                  const now = new Date();
                  const duePosts = posts.filter(p => p.status === 'pending' && new Date(p.scheduledAt) <= now);

                  for (let post of duePosts) {
                    try {
                      await fetch(`https://graph.facebook.com/v21.0/${post.pageId}/feed`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: post.content, access_token: post.pageToken })
                      });
                      post.status = 'published';
                    } catch (e) {
                      post.status = 'failed';
                    }
                  }
                  localStorage.setItem('scheduled_posts', JSON.stringify(posts));
                }, 60000); // Check every 1 minute
              }
              return () => clearInterval(interval);
            }, [engineOn]);

            return (
              <div className="p-5 space-y-5">
                <div className="flex justify-between items-start">
                  <div>
                    <p className="text-slate-400 text-sm">Hi, Abdul</p>
                    <h1 className="text-3xl font-bold text-white">Dashboard</h1>
                  </div>
                  <div className="flex items-center gap-3">
                    <Bell size={20} className="text-slate-300" />
                    <button className="bg-orange-500 text-white text-xs font-bold px-3 py-1.5 rounded-full">Upgrade</button>
                  </div>
                </div>

                <div className="bg-[#1E293B] rounded-xl p-4 flex items-center gap-4 border border-slate-800">
                  <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center font-bold text-red-600 text-xl">A</div>
                  <div className="flex-1">
                    <h3 className="font-semibold text-white">Adsterra earnings</h3>
                    <p className="text-xs text-slate-400">Add your publisher API keys to see revenue here.</p>
                  </div>
                  <ChevronRight size={18} className="text-slate-500" />
                </div>

                <div className="bg-[#1E293B] rounded-xl p-4 border border-slate-800">
                  <div className="flex justify-between items-center mb-2">
                    <div className="flex items-center gap-2">
                      <div className={`w-2 h-2 rounded-full ${engineOn ? 'bg-emerald-500' : 'bg-slate-500'}`} />
                      <h3 className="font-semibold text-white">{engineOn ? 'Engine Running' : 'Engine stopped'}</h3>
                    </div>
                    <button onClick={() => setEngineOn(!engineOn)} className={`w-12 h-12 rounded-full flex items-center justify-center shadow-lg ${engineOn ? 'bg-emerald-500 shadow-emerald-500/20' : 'bg-orange-500 shadow-orange-500/20'}`}>
                      <Power size={22} className="text-white" />
                    </button>
                  </div>
                  <p className="text-xs text-slate-400">Start it to post your schedule all day, even with the app closed</p>
                  <p className="text-xs text-orange-500 mt-2 font-medium">Phone has an Auto-start setting? Turn it on for AlcashGo</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {[
                    { label: 'Total Pages', value: '0', icon: LayoutGrid, color: 'text-yellow-500', bg: 'bg-yellow-500/10' },
                    { label: 'Active Pages', value: '0', icon: CheckCircle2, color: 'text-orange-500', bg: 'bg-orange-500/10' },
                    { label: 'Posted', value: '0', icon: CheckCircle2, color: 'text-emerald-500', bg: 'bg-emerald-500/10' },
                    { label: 'Failed', value: '0', icon: AlertCircle, color: 'text-red-500', bg: 'bg-red-500/10' },
                    { label: 'Scheduled', value: '0', icon: Clock, color: 'text-yellow-500', bg: 'bg-yellow-500/10' },
                    { label: 'Followers', value: '0', icon: Users, color: 'text-blue-500', bg: 'bg-blue-500/10' },
                  ].map((stat, i) => (
                    <div key={i} className="bg-[#1E293B] rounded-xl p-4 border border-slate-800">
                      <div className={`w-8 h-8 rounded-lg flex items-center justify-center mb-3 ${stat.bg}`}><stat.icon size={16} className={stat.color} /></div>
                      <p className="text-2xl font-bold text-white">{stat.value}</p>
                      <p className="text-xs text-slate-400">{stat.label}</p>
                    </div>
                  ))}
                </div>
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Compose.tsx << 'ENDOFFILE'
          import { useState } from 'react';
          import { Image as ImageIcon, Smartphone, Send } from 'lucide-react';

          export default function Compose() {
            const [activeTab, setActiveTab] = useState('schedule');
            const [postType, setPostType] = useState('reel');
            const [when, setWhen] = useState('now');
            const [content, setContent] = useState('');
            const [firstComment, setFirstComment] = useState(false);
            const [date, setDate] = useState('');

            const handlePost = async () => {
              if (!content) return alert('Please write a caption!');
              
              const pages = JSON.parse(localStorage.getItem('connected_pages') || '[]');
              if (pages.length === 0) return alert('Please connect a page first in Pages tab!');

              const posts = JSON.parse(localStorage.getItem('scheduled_posts') || '[]');
              posts.push({
                pageId: pages[0].id,
                pageToken: pages[0].access_token,
                content: content,
                scheduledAt: when === 'now' ? new Date() : new Date(date),
                status: 'pending'
              });
              localStorage.setItem('scheduled_posts', JSON.stringify(posts));
              alert(when === 'now' ? 'Posting started from Phone!' : 'Post Scheduled on Phone!');
            };

            return (
              <div className="p-5 space-y-5 pb-24">
                <h1 className="text-2xl font-bold text-white">Create</h1>

                <div className="flex bg-[#1E293B] rounded-xl p-1 border border-slate-800">
                  <button onClick={() => setActiveTab('schedule')} className={`flex-1 py-2 text-sm font-semibold rounded-lg ${activeTab === 'schedule' ? 'bg-orange-500 text-white' : 'text-slate-400'}`}>Schedule a post</button>
                  <button onClick={() => setActiveTab('bulk')} className={`flex-1 py-2 text-sm font-semibold rounded-lg ${activeTab === 'bulk' ? 'bg-orange-500 text-white' : 'text-slate-400'}`}>Bulk Daily</button>
                </div>
                <p className="text-xs text-slate-400">Stories, Bulk Daily and First Comment are Lifetime features.</p>

                <div>
                  <h3 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Pages</h3>
                  <p className="text-orange-500 text-sm">Turn on at least one Page in the Pages tab.</p>
                </div>

                <div>
                  <h3 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Type</h3>
                  <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                    {['Reel', 'Image', 'Img story', 'Reel story'].map((t) => (
                      <button key={t} onClick={() => setPostType(t.toLowerCase())} className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap ${postType === t.toLowerCase() ? 'bg-orange-500 text-white' : 'bg-[#1E293B] text-slate-300 border border-slate-800'}`}>
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Media</h3>
                  <div className="flex gap-3">
                    <button className="flex-1 bg-[#1E293B] border border-slate-700 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium"><ImageIcon size={18} /> From library</button>
                    <button className="flex-1 bg-[#1E293B] border border-slate-700 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-medium"><Smartphone size={18} /> From phone</button>
                  </div>
                </div>

                <div>
                  <h3 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Caption</h3>
                  <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-4">
                    <textarea value={content} onChange={(e) => setContent(e.target.value)} rows={4} placeholder="Write a caption. Paste several (empty line between) to rotate them across Pages." className="w-full bg-transparent text-sm text-white placeholder-slate-500 outline-none resize-none" />
                    <p className="text-xs text-orange-500 mt-2">0 found</p>
                    <div className="flex gap-2 mt-2">
                      <button className="bg-orange-500 text-white text-xs font-medium px-4 py-1.5 rounded-lg">Random</button>
                      <button className="text-slate-400 text-xs font-medium px-4 py-1.5 rounded-lg">Use & remove</button>
                      <button className="text-slate-400 text-xs font-medium px-4 py-1.5 rounded-lg">One for all</button>
                    </div>
                  </div>
                </div>

                <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                  <div>
                    <h3 className="font-semibold text-white text-sm">Add first comment</h3>
                    <p className="text-xs text-slate-400">Lifetime feature</p>
                  </div>
                  <button onClick={() => setFirstComment(!firstComment)} className={`w-12 h-6 rounded-full transition-colors ${firstComment ? 'bg-orange-500' : 'bg-slate-700'} relative`}>
                    <div className={`w-4 h-4 rounded-full bg-white absolute top-1 transition-transform ${firstComment ? 'translate-x-7' : 'translate-x-1'}`} />
                  </button>
                </div>

                <div>
                  <h3 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">When</h3>
                  <div className="flex bg-[#1E293B] rounded-xl p-1 border border-slate-800 mb-3">
                    <button onClick={() => setWhen('now')} className={`flex-1 py-2 text-sm font-semibold rounded-lg ${when === 'now' ? 'bg-orange-500 text-white' : 'text-slate-400'}`}>Post now</button>
                    <button onClick={() => setWhen('schedule')} className={`flex-1 py-2 text-sm font-semibold rounded-lg ${when === 'schedule' ? 'bg-orange-500 text-white' : 'text-slate-400'}`}>Schedule</button>
                  </div>
                  {when === 'schedule' && (
                    <input type="datetime-local" value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-[#1E293B] border border-slate-800 text-white rounded-xl py-3 px-4 outline-none focus:border-orange-500" />
                  )}
                </div>

                <button onClick={handlePost} className="w-full bg-orange-500 text-white font-semibold py-4 rounded-xl flex items-center justify-center gap-2 mt-4 shadow-lg shadow-orange-500/20">
                  <Send size={18} /> {when === 'now' ? 'Post now' : 'Schedule Post'}
                </button>
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Pages.tsx << 'ENDOFFILE'
          import { useState, useEffect } from 'react';
          import { Search, LayoutGrid } from 'lucide-react';
          import { Browser } from '@capacitor/browser';
          import { App } from '@capacitor/app';

          export default function Pages() {
            const [pages, setPages] = useState<any[]>([]);

            useEffect(() => {
              const savedPages = JSON.parse(localStorage.getItem('connected_pages') || '[]');
              setPages(savedPages);

              const listener = App.addListener('appUrlOpen', async (event) => {
                if (event.url.includes('auth')) {
                  const url = new URL(event.url);
                  const code = url.searchParams.get('code');
                  if (code) {
                    await Browser.close();
                    await exchangeToken(code);
                  }
                }
              });
              return () => { listener.then(l => l.remove()); };
            }, []);

            const connectFacebook = async () => {
              const appId = localStorage.getItem('fb_app_id');
              if (!appId) return alert('Please set your Facebook App ID in Settings (More tab) first!');

              const redirectUri = 'com.alcashgo.clone://auth'; 
              const url = `https://www.facebook.com/v21.0/dialog/oauth?client_id=${appId}&redirect_uri=${redirectUri}&scope=pages_manage_posts,pages_show_list`;
              await Browser.open({ url });
            };

            const exchangeToken = async (code: string) => {
              const appId = localStorage.getItem('fb_app_id');
              const appSecret = localStorage.getItem('fb_app_secret');
              const redirectUri = 'com.alcashgo.clone://auth';

              try {
                const tokenRes = await fetch(`https://graph.facebook.com/v21.0/oauth/access_token?client_id=${appId}&client_secret=${appSecret}&redirect_uri=${redirectUri}&code=${code}`);
                const tokenData = await tokenRes.json();
                
                if (tokenData.error) throw new Error(tokenData.error.message);

                const pagesRes = await fetch(`https://graph.facebook.com/v21.0/me/accounts?access_token=${tokenData.access_token}`);
                const pagesData = await pagesRes.json();

                if (pagesData.data) {
                  localStorage.setItem('connected_pages', JSON.stringify(pagesData.data));
                  setPages(pagesData.data);
                  alert('Facebook Connected Successfully!');
                }
              } catch (err: any) {
                alert('Error: ' + err.message);
              }
            };

            return (
              <div className="p-5 space-y-5">
                <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-bold text-white">Pages</h1>
                  <LayoutGrid size={20} className="text-slate-400" />
                </div>

                <div className="bg-[#1E293B] rounded-xl p-4 flex items-center justify-between border border-slate-800">
                  <div>
                    <h3 className="font-semibold text-white">Free plan · unlimited Pages</h3>
                    <p className="text-xs text-slate-400 mt-1">{pages.length} Pages connected.</p>
                  </div>
                  <button className="bg-orange-500 text-white text-xs font-bold px-4 py-2 rounded-lg">Upgrade</button>
                </div>

                <div className="relative">
                  <Search size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input type="text" placeholder="Search Pages" className="w-full bg-[#1E293B] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 outline-none focus:border-orange-500" />
                </div>

                {pages.length === 0 ? (
                  <div className="flex flex-col items-center justify-center mt-20 space-y-4">
                    <div className="w-20 h-20 bg-[#1E293B] rounded-2xl flex items-center justify-center border border-slate-800">
                      <LayoutGrid size={32} className="text-orange-500" />
                    </div>
                    <h2 className="text-xl font-bold text-white">No Pages yet</h2>
                    <p className="text-sm text-slate-400 text-center px-8">Connect your own Facebook app to bring in your Pages.</p>
                    <button onClick={connectFacebook} className="bg-orange-500 text-white font-semibold px-8 py-3 rounded-xl mt-2">Connect</button>
                  </div>
                ) : (
                  <div className="space-y-3 mt-4">
                    {pages.map((page: any) => (
                      <div key={page.id} className="bg-[#1E293B] rounded-xl p-4 border border-slate-800 flex items-center gap-4">
                        <div className="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">{page.name.charAt(0)}</div>
                        <div className="flex-1">
                          <h3 className="font-semibold text-white">{page.name}</h3>
                          <p className="text-xs text-slate-400">ID: {page.id}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          }
          ENDOFFILE

          cat > src/pages/Library.tsx << 'ENDOFFILE'
          import { Plus, Folder, Sparkles } from 'lucide-react';

          export default function Library() {
            return (
              <div className="p-5 space-y-5">
                <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-bold text-white">Library</h1>
                  <button className="bg-[#1E293B] p-2 rounded-lg border border-slate-800"><Plus size={20} className="text-white" /></button>
                </div>

                <div className="bg-[#1E293B] rounded-xl p-4 border border-slate-800">
                  <h3 className="font-semibold text-white">0 files in 1 folders</h3>
                  <p className="text-xs text-slate-400 mt-1 mb-4">Files stay on your phone. AlcashGo only remembers where they are and uploads them when a post goes out.</p>
                  <div className="flex gap-3">
                    <button className="flex-1 bg-orange-500 text-white font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 text-sm"><Sparkles size={16} /> Page folder set</button>
                    <button className="flex-1 bg-[#0F172A] border border-slate-700 text-white font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 text-sm"><Plus size={16} /> Folder</button>
                  </div>
                </div>

                <div className="bg-[#1E293B] rounded-xl p-4 border border-slate-800 flex items-center gap-4">
                  <div className="w-10 h-10 bg-yellow-500/10 rounded-lg flex items-center justify-center"><Folder size={20} className="text-yellow-500" /></div>
